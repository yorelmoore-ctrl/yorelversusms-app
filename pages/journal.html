<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Evidence I Exist 📖</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="app">


<header class="hero">

<p class="tiny-text">
✨ your story is worth keeping ✨
</p>


<h1>
Evidence<br>
I Exist 📖
</h1>


<p>
A safe place for your thoughts, symptoms, memories, and victories.
</p>


</header>







<section class="card">


<div class="card-title">
📝 Today's Entry
</div>



<textarea 
id="journalText"
placeholder="Write about your day, symptoms, wins, feelings, or anything you want to remember..."
></textarea>




<button 
class="primary-btn"
id="saveJournal">

💜 Save My Chapter

</button>



<p id="journalMessage"></p>


</section>







<section class="card">


<div class="card-title">
📚 Previous Chapters
</div>


<div id="journalEntries">

<p>
Your memories will appear here.
</p>


</div>


</section>







<section class="journal-banner">


<h2>
Main Character Moment ✨
</h2>


<p>
Every chapter counts. Even the ones written in brain fog.
</p>


</section>





</div>






<script src="../js/storage.js"></script>

<script src="../js/journal.js"></script>


</body>

</html>
