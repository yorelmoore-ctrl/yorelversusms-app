<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile 💜</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body>


<div class="app">


<header class="hero">

<p class="tiny-text">
✨ your chronic illness journey ✨
</p>


<h1>
My Profile 💜
</h1>


<p>
Your story, your progress, your chapter.
</p>


</header>





<section class="card">


<div class="card-title">
🦋 About Me
</div>




<label>
Name
</label>


<input 
id="profileName"
type="text"
placeholder="Your name">





<label>
Diagnosis Journey
</label>


<input 
id="diagnosis"
type="text"
placeholder="Example: MS + Optic Neuritis">





<label>
Treatment / Medication
</label>


<input 
id="treatment"
type="text"
placeholder="Example: Rituximab 💉">





<label>
My Reminder
</label>


<textarea
id="affirmationInput"
placeholder="Something you want to remember on hard days..."
></textarea>





<button 
class="primary-btn"
id="saveProfile">

💜 Save Profile

</button>



<p id="profileMessage"></p>



</section>







<section class="card">


<div class="card-title">
✨ My Chapter
</div>



<div id="profileDisplay">

<p>
Your profile will appear here.
</p>


</div>



</section>






</div>



<script src="../js/storage.js"></script>

<script src="../js/profile.js"></script>


</body>

</html>
